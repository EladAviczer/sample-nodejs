# Test case: every optional feature enabled, so every template is rendered and checked.
image:
  repository: registry.example.com/sample-app
  tag: "ci"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    - secretName: sample-app-tls
      hosts:
        - sample-app.local

autoscaling:
  enabled: true

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

serviceAccount:
  annotations:
    example.com/role: ci-test
