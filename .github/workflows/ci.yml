name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sample-nodejs

jobs:
  # ── 1. SAST ────────────────────────────────────────────────────────────────
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: npm audit — SCA (block on HIGH+)
        run: npm audit --audit-level=high

      - name: nodejsscan — SAST (block on any finding)
        uses: ajinabraham/njsscan-action@master
        with:
          args: "."

  # ── 2. Helm lint ───────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Helm chart
        run: helm lint helm/

  # ── 3. Build → Trivy scan → ECR push (push only on git tags) ──────────────
  build-scan-push:
    name: Build / Scan / Push
    runs-on: ubuntu-latest
    needs: [sast, helm-lint]
    permissions:
      id-token: write  # OIDC → AWS
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (local daemon)
        run: |
          docker build \
            --tag "${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}" \
            --file Dockerfile \
            .

      - name: Trivy scan — gate on HIGH+ (ignore unfixed)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: "true"
          format: "sarif"
          output: "trivy.sarif"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif

      # Tag releases only ──────────────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker tag "${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          echo "pushed: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"

  # ── 4. Open deploy PR (updates helm/values.yaml image tag) ─────────────────
  update-image-tag:
    name: Open Deploy PR
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Patch helm/values.yaml
        env:
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.build-scan-push.outputs.ecr_registry }}
        run: |
          yq e ".image.repository = \"$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}\"" \
            -i helm/values.yaml
          yq e ".image.tag = \"$IMAGE_TAG\"" -i helm/values.yaml

      - name: Create deploy PR
        env:
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.build-scan-push.outputs.ecr_registry }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deploy/image-${IMAGE_TAG}"
          git checkout -b "$BRANCH"
          git add helm/values.yaml
          git commit -m "chore: deploy image ${IMAGE_TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: deploy image ${IMAGE_TAG}" \
            --body "Automated image tag update. Image: \`${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}\`. Merge to trigger ArgoCD sync." \
            --base main \
            --head "$BRANCH"
