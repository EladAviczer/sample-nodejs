name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref on new pushes (PRs only — never cancel a release)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default: read-only. Jobs that need more declare it themselves.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sample-nodejs

jobs:
  detect:
    name: Route by branch + changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.routes.outputs.app }}
      helm: ${{ steps.routes.outputs.helm }}
      terraform: ${{ steps.routes.outputs.terraform }}
      argocd: ${{ steps.routes.outputs.argocd }}
      verify: ${{ steps.routes.outputs.verify }}
      release: ${{ steps.routes.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify branch and changed paths
        id: routes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "verify=false" >> "$GITHUB_OUTPUT"
            PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p' || true)
            RANGE="${PREV:+${PREV}..HEAD}"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "verify=true" >> "$GITHUB_OUTPUT"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              git fetch origin "$BASE_REF" --no-tags
              RANGE="origin/${BASE_REF}...HEAD"
            elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              RANGE="HEAD^..HEAD"
            else
              RANGE=""
            fi
          fi

          if [[ -n "$RANGE" ]]; then
            CHANGED=$(git diff --name-only "$RANGE")
          else
            CHANGED=$(git ls-files)
          fi

          printf 'Changed files:\n%s\n' "$CHANGED"

          check() {
            if printf '%s\n' "$CHANGED" | grep -qE "$1"; then
              echo "$2=true" >> "$GITHUB_OUTPUT"
            else
              echo "$2=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check '^(app\.js|package(-lock)?\.json|Dockerfile)$' app
          check '^helm/' helm
          check '^terraform/' terraform
          check '^argocd/' argocd

  sast:
    name: SAST
    needs: detect
    if: needs.detect.outputs.verify == 'true' && needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - run: npm ci

      - name: npm audit — SCA (block on HIGH+)
        run: npm audit --audit-level=high

      - name: nodejsscan — SAST (block on any finding)
        uses: ajinabraham/njsscan-action@v9
        with:
          args: "."

  lint:
    name: Lint
    needs: detect
    if: needs.detect.outputs.verify == 'true' && needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint — Dockerfile linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3018

  lint-helm:
    name: Helm lint
    needs: detect
    if: needs.detect.outputs.verify == 'true' && needs.detect.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Helm lint
        run: helm lint helm/ --strict

  check-terraform:
    name: Terraform fmt + validate + plan
    needs: detect
    if: needs.detect.outputs.verify == 'true' && needs.detect.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write  # OIDC → AWS for plan
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color

  validate-argocd:
    name: Validate ArgoCD manifest
    needs: detect
    if: needs.detect.outputs.verify == 'true' && needs.detect.outputs.argocd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate manifest structure
        run: |
          for f in argocd/*.yaml argocd/*.yml; do
            [ -e "$f" ] || continue
            yq e '.' "$f" > /dev/null
            test -n "$(yq e '.apiVersion // ""' "$f")"
            test -n "$(yq e '.kind // ""' "$f")"
          done

  build-and-scan:
    name: Build & Trivy Scan
    needs: detect
    if: needs.detect.outputs.verify == 'true' && needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Derive image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (local)
        run: docker build -t "${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}" .

      - name: Trivy scan — gate on HIGH+ (ignore unfixed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: "true"
          format: "sarif"
          output: "trivy.sarif"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif

  build-scan-push:
    name: Build / Scan / Push
    needs: detect
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write  # OIDC → AWS
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive image tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (local)
        run: docker build -t "${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}" .

      - name: Trivy scan — gate on HIGH+ (ignore unfixed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: "true"
          format: "sarif"
          output: "trivy.sarif"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker tag "${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"

  update-image-tag:
    name: Open Deploy PR
    needs: [detect, build-scan-push]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Patch helm/values.yaml
        env:
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.build-scan-push.outputs.ecr_registry }}
        run: |
          yq e ".image.repository = \"$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}\"" \
            -i helm/values.yaml
          yq e ".image.tag = \"$IMAGE_TAG\"" -i helm/values.yaml

      - name: Create deploy PR
        env:
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.build-scan-push.outputs.ecr_registry }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deploy/image-${IMAGE_TAG}"
          git checkout -b "$BRANCH"
          git add helm/values.yaml
          git commit -m "chore: deploy image ${IMAGE_TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: deploy image ${IMAGE_TAG}" \
            --body "Automated image tag update. Image: \`${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}\`. Merge to trigger ArgoCD sync." \
            --base main \
            --head "$BRANCH"
