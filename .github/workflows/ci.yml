name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --error fails the job on any finding; --severity ERROR limits findings to the highest-severity rules
      - name: Semgrep scan
        run: >-
          semgrep scan --config p/javascript --config p/nodejsscan
          --severity ERROR --error --metrics=off
          --sarif-output=semgrep.sarif

      # Runs even when the scan fails, so findings still reach the Security tab
      - name: Upload results to Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif

  helm:
    runs-on: ubuntu-latest
    container: quay.io/helmpack/chart-testing:v3.15.0@sha256:54317f2d93730ea9ca1236e3d79cd95d74110b8d733b6ab124e5829209b5f4e4
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    defaults:
      run:
        shell: bash
    steps:
      # Full history so ct can diff against main and check the chart version bump
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The container runs as a different user than the checkout owner; git refuses such repos by default
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Lints each chart/ci/*-values.yaml; fails if the chart changed without a version bump
      - name: Chart lint (ct)
        run: ct lint --chart-dirs . --target-branch main --validate-maintainers=false

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz -C /usr/local/bin kubeconform

      # Second schema location covers CRDs such as ServiceMonitor
      - name: Validate rendered manifests (kubeconform)
        run: |
          for f in chart/ci/*-values.yaml; do
            echo "== $f"
            helm template ci chart -f "$f" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  build:
    needs: [test, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: sample-app:${{ github.sha }}
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t "$IMAGE" .

      # Docker socket lets Trivy read the local image; the cache mount reuses the vulnerability DB between the two scans
      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          "$TRIVY_IMAGE" image
          --severity HIGH,CRITICAL --exit-code 1
          "$IMAGE"

      # Runs even when the scan fails, so findings still reach the Security tab
      - name: Trivy SARIF report
        if: success() || failure()
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          -v "$PWD:/out"
          "$TRIVY_IMAGE" image
          --severity HIGH,CRITICAL --format sarif --output /out/trivy.sarif
          "$IMAGE"

      - name: Upload results to Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy
